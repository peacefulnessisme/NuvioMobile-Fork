name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "NUVIO_SUPABASE_URL=" >> local.properties
          echo "NUVIO_SUPABASE_ANON_KEY=" >> local.properties

      - name: Build debug APK
        run: ./gradlew :androidApp:assemblePlaystoreDebug -Pnuvio.android.distribution=playstore --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-apk
          path: androidApp/build/outputs/apk/**/*.apk
